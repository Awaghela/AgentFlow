# Railway deployment config for the AgentFlow backend.
#
# In the Railway dashboard: New Project → Deploy from GitHub repo →
# set this service's "Root Directory" to `backend` so Railway finds this
# file and the Dockerfile alongside it.
#
# Railway auto-injects $PORT at runtime; the Dockerfile's CMD already
# binds uvicorn to it (falling back to 8000 for local `docker compose up`,
# where $PORT isn't set).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
